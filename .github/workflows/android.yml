name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after both builds pass
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nbetcher/neon_grid_theme
          ref: eb78a5521adf4e7a698d97bfe816d6ac1fa26dab
          path: .theme
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        env:
          VARIANT: ${{ matrix.variant }}
          APP_KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f keystore.jks' EXIT
          # Both distributed variants use the same identity. This workflow only
          # runs trusted repository refs, never pull-request code with secrets.
          test -n "$APP_KEYSTORE_B64" && test -n "$RELEASE_KEYSTORE_PASSWORD" && test -n "$RELEASE_KEYSTORE_ALIAS" || {
            echo '::error::Set APP_KEYSTORE_B64, APP_KEYSTORE_PASSWORD and APP_KEY_ALIAS repository secrets.'
            exit 1
          }
          umask 077
          printf '%s' "$APP_KEYSTORE_B64" | base64 --decode > keystore.jks
          export RELEASE_KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-$RELEASE_KEYSTORE_PASSWORD}"
          if [ "$VARIANT" = release ]; then
            TASKS=(':app:assembleRelease' ':app:lintRelease')
          else
            TASKS=(':app:testDebugUnitTest' ':app:assembleDebug')
          fi
          bash gradlew --no-daemon --stacktrace --max-workers=2 "${TASKS[@]}" -PRELEASE_SIGN_DEBUG=true -PneonGridDir="$GITHUB_WORKSPACE/.theme/android"
      - name: Verify and package APK
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          META="app/build/outputs/apk/$VARIANT/output-metadata.json"
          VERSION="$(jq -r '.elements[0].versionName' "$META")"
          FILE="$(jq -r '.elements[0].outputFile' "$META")"
          case "$GITHUB_REF_NAME" in
            "v$VERSION"|"v$VERSION."*) ;;
            *)
              if [ "$GITHUB_REF_TYPE" = tag ]; then
                echo '::error::Tag does not match application version'; exit 1
              fi
              ;;
          esac
          APK="PebbleTasker-$VERSION-${GITHUB_SHA:0:8}-$VARIANT.apk"
          mkdir -p dist
          cp "app/build/outputs/apk/$VARIANT/$FILE" "dist/$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "dist/$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.variant }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 30
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && (inputs.publish == true || inputs.publish == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          BASE_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          test -n "$BASE_VERSION"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(python3 tools/generate_release_notes.py --determine-tag --base-version "$BASE_VERSION")"
          fi

          RELEASE_VERSION="${TAG#v}"
          echo "Cutting release: $TAG ($RELEASE_VERSION)"

          # Align APK filenames and checksums with the cut release version
          if [ "$RELEASE_VERSION" != "$BASE_VERSION" ]; then
            for f in dist/PebbleTasker-$BASE_VERSION-*; do
              if [ -f "$f" ]; then
                mv "$f" "${f/$BASE_VERSION/$RELEASE_VERSION}"
              fi
            done
            (cd dist && rm -f *.sha256 && for apk in *.apk; do sha256sum "$apk" > "$apk.sha256"; done)
          fi

          # Generate cumulative business-interpretation changelog
          python3 tools/generate_release_notes.py \
            --tag "$TAG" \
            --version-name "$RELEASE_VERSION" \
            --output release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "PebbleTasker $RELEASE_VERSION" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "PebbleTasker $RELEASE_VERSION" \
              --notes-file release-notes.md
          fi
