# Project-wide Gradle settings for the Pebble x Tasker plugin.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX. R classes are TRANSITIVE so the app's R sees the Neon Grid library's ng_* resources
# (colors/drawables/styles), which moved out of this module into the :theme composite build. The
# config code references them via this module's R, so transitive R keeps those references resolving
# without rewriting every call site to the library R.
android.useAndroidX=true
android.nonTransitiveRClass=false

# Kotlin official code style.
kotlin.code.style=official
